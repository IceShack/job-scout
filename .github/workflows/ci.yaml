name: CI

on:
  push:
    branches: [main]
    # Releases: a vX.Y.Z tag also publishes an image tagged with the version.
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/iceshack/job-scout/scraper

jobs:
  scraper:
    name: Scraper — build, test & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.2"
          cache-dependency-path: scraper/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The document is generated from the route table; a stale checked-in
      # copy means someone changed the API without regenerating it.
      - name: OpenAPI document is current
        run: |
          go run ./cmd/scraper -openapi > ../docs/openapi.json
          git diff --exit-code ../docs/openapi.json \
            || { echo "::error::docs/openapi.json is stale — run 'make openapi'"; exit 1; }

      # internal/version is the source of truth; a tag that disagrees with
      # it would publish an image whose name lies about its contents.
      - name: Tag matches internal/version
        if: github.ref_type == 'tag'
        run: |
          code="v$(go run ./cmd/scraper -version)"
          if [ "$code" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match the code version $code"
            exit 1
          fi

      - name: Image tags
        id: image
        if: (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.event_name != 'pull_request'
        run: |
          {
            echo "tags<<TAGS"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${{ github.sha }}"
            if [ "${{ github.ref_type }}" = tag ]; then
              echo "${IMAGE}:$(go run ./cmd/scraper -version)"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: scraper
          push: true
          tags: ${{ steps.image.outputs.tags }}
