# Plain Ingress — works on any cluster with an ingress controller. Point
# the host at your own domain and adjust the class/TLS to your setup. If
# you run Traefik with its CRDs, use ingressroute-traefik.yaml instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scraper
spec:
  ingressClassName: nginx
  rules:
    - host: jobs.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scraper
                port:
                  number: 8080
